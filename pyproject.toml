[project]
name = "instagram-sentiment-analysis-backend"
version = "0.2.0"
description = "Instagram comment sentiment analysis with Streamlit, LangChain and Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.61",
    "langchain>=1.3",
    "langchain-groq>=1.1",
    "instaloader>=4.15",
    "pandas>=2.2",
    "plotly>=5.24",
    "wordcloud>=1.9",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "emoji>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ"]
